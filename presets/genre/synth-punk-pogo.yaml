name: Synth-Punk Pogo
slug: synth-punk-pogo
author: jambox
bpm: 150
key: Am
vibe: Home Front energy — oi! choruses over new-wave synths, punk drums you can dance to
notes: 'Built around Home Front (Edmonton synth-punk): street-punk gang vocals,
  chorus-drenched jangle guitar, bright analog synth hooks, driving eighth-note
  bass, drum-machine punch. Fast but never sludgy, it bounces. Am keeps it
  diatonic to the default set (harmonizes with Disco Inferno / Dub Cooldown);
  150 halves to 75 for a cooldown and sits near Riot Mode (160) for a punk run.
  Pads 9-10 are the hooks: play the synth stab chromatically over any karaoke
  song in A minor / C major.

  '
