vibe: Crowd-pleasing one-shots that land on any song, any key, any tempo
notes: 'Bank A (internal memory) on karaoke night. Every pad is a one-shot so it
  works over arbitrary songs: no loops to clash with the key or drift off the
  tempo. Pad order is fixed: scripts/karaoke_drops.py drafts drop sheets
  against these pad numbers (1 cheer, 2 applause, 3 air horn, 4 choir stab,
  5 crash, 6 rewind, 7 riser, 8 impact, 9 hype vox, 10 scratch, 11 laser,
  12 gong). Mic 2 and the drops share one fader (M6 CH2), so build this bank a
  few dB under the vocal.

  '
